<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080915" />
      <stop offset="40%" stop-color="#0d1127" />
      <stop offset="100%" stop-color="#060710" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c3a" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f1329" stop-opacity="0.85" />
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#ec4899" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="innerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e0e7ff" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="discordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="100%" stop-color="#404EED" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.07" />
      <circle cx="30" cy="0" r="1.5" fill="#818cf8" fill-opacity="0.15" />
    </pattern>

    <!-- Dot Matrix Pattern -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#c084fc" fill-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .title-anim { font-weight: 900; letter-spacing: -1.5px; }
  </style>

  <!-- Base Canvas & Border -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="20" fill="url(#techGrid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="80" r="140" fill="#7c3aed" fill-opacity="0.16" filter="url(#glow)" />
  <circle cx="1050" cy="320" r="160" fill="#06b6d4" fill-opacity="0.13" filter="url(#glow)" />
  <circle cx="650" cy="200" r="180" fill="#4f46e5" fill-opacity="0.10" filter="url(#glow)" />
  <circle cx="950" cy="90" r="100" fill="#ec4899" fill-opacity="0.12" filter="url(#glow)" />

  <!-- Outer Neon Border Stroke -->
  <rect x="2" y="2" width="1196" height="416" rx="19" fill="none" stroke="url(#borderGrad)" stroke-width="1.8" stroke-opacity="0.9" />

  <!-- Top Terminal Header Bar -->
  <g transform="translate(30, 24)">
    <!-- Terminal Dots -->
    <circle cx="12" cy="12" r="6" fill="#ef4444" fill-opacity="0.85" />
    <circle cx="32" cy="12" r="6" fill="#eab308" fill-opacity="0.85" />
    <circle cx="52" cy="12" r="6" fill="#22c55e" fill-opacity="0.85" />

    <!-- Terminal Breadcrumb / File Name -->
    <rect x="76" y="0" width="180" height="24" rx="6" fill="#1e1b4b" fill-opacity="0.6" stroke="#4338ca" stroke-width="1" />
    <text x="90" y="16" fill="#a5b4fc" font-size="11" font-weight="600" class="font-mono">pir_fena.config.ts</text>

    <!-- Status Live Badge (Middle) -->
    <g transform="translate(420, 0)">
      <rect width="270" height="25" rx="12.5" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <circle cx="15" cy="12.5" r="4" fill="#22c55e" />
      <circle cx="15" cy="12.5" r="7" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.6" />
      <text x="28" y="16.5" fill="#94a3b8" font-size="11" font-weight="500" class="font-mono">STATUS: <tspan fill="#38bdf8" font-weight="700">BUILDING COOL APPS</tspan></text>
    </g>

    <!-- Environment Tag (Right) -->
    <g transform="translate(990, 0)">
      <rect width="150" height="24" rx="6" fill="#0b1329" stroke="#1d4ed8" stroke-width="1" stroke-dasharray="3 2" />
      <text x="75" y="16" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle" class="font-mono">ENV: PRODUCTION</text>
    </g>
  </g>

  <!-- Dividing Line -->
  <line x1="30" y1="64" x2="1170" y2="64" stroke="#312e81" stroke-width="1" stroke-opacity="0.5" />

  <!-- ================= LEFT HERO SECTION ================= -->
  <g transform="translate(50, 95)">
    <!-- Subtitle / Eyebrow -->
    <g transform="translate(0, 10)">
      <rect width="195" height="26" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" fill-opacity="0.6" />
      <text x="12" y="17" fill="#a855f7" font-size="11" font-weight="700" letter-spacing="1.2" class="font-mono">DISCORD DEVELOPER</text>
    </g>

    <!-- Main Nickname / Headline -->
    <g transform="translate(0, 75)">
      <!-- Text shadow / glow effect -->
      <text x="0" y="0" fill="#a855f7" font-size="64" class="font-sans title-anim" opacity="0.3" filter="url(#softGlow)">pir_fena</text>
      <text x="0" y="0" fill="url(#nameGrad)" font-size="64" class="font-sans title-anim">pir_fena</text>
      <!-- Verified / Bot checkmark icon -->
      <g transform="translate(290, -48)">
        <circle cx="18" cy="18" r="18" fill="#5865f2" />
        <path d="M11 18 L16 23 L25 13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Primary Role Badge -->
    <g transform="translate(0, 98)">
      <rect width="325" height="38" rx="10" fill="url(#badgeGrad)" stroke="#8b5cf6" stroke-width="1.2" />
      <text x="14" y="24" fill="#ec4899" font-size="15" font-weight="700" class="font-mono">&gt;_</text>
      <text x="40" y="24" fill="#f1f5f9" font-size="16" font-weight="700" class="font-sans">Web &amp; Discord Bot Developer</text>
    </g>

    <!-- Specialization Tags: JavaScript • Node.js • Web Dev -->
    <g transform="translate(0, 155)">
      <rect width="350" height="32" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="16" r="4" fill="#facc15" />
      <text x="28" y="21" fill="#cbd5e1" font-size="13" font-weight="600" class="font-mono">
        <tspan fill="#facc15">JavaScript</tspan>
        <tspan fill="#64748b"> • </tspan>
        <tspan fill="#22c55e">Node.js</tspan>
        <tspan fill="#64748b"> • </tspan>
        <tspan fill="#38bdf8">Web Dev</tspan>
      </text>
    </g>

    <!-- PROGRAMMING LANGUAGES ROW (Pills) -->
    <g transform="translate(0, 212)">
      <text x="0" y="-8" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">LANGUAGES &amp; CORE TECH:</text>

      <!-- Python -->
      <g transform="translate(0, 5)">
        <rect width="76" height="28" rx="6" fill="#141c38" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.5" />
        <circle cx="12" cy="14" r="3" fill="#38bdf8" />
        <text x="22" y="18" fill="#93c5fd" font-size="12" font-weight="600" class="font-sans">Python</text>
      </g>

      <!-- JavaScript -->
      <g transform="translate(84, 5)">
        <rect width="94" height="28" rx="6" fill="#201d13" stroke="#eab308" stroke-width="1" stroke-opacity="0.5" />
        <circle cx="12" cy="14" r="3" fill="#facc15" />
        <text x="22" y="18" fill="#fef08a" font-size="12" font-weight="600" class="font-sans">JavaScript</text>
      </g>

      <!-- Rust -->
      <g transform="translate(186, 5)">
        <rect width="64" height="28" rx="6" fill="#251614" stroke="#f97316" stroke-width="1" stroke-opacity="0.5" />
        <circle cx="12" cy="14" r="3" fill="#fb923c" />
        <text x="22" y="18" fill="#fdba74" font-size="12" font-weight="600" class="font-sans">Rust</text>
      </g>

      <!-- C++ -->
      <g transform="translate(258, 5)">
        <rect width="60" height="28" rx="6" fill="#131c36" stroke="#0284c7" stroke-width="1" stroke-opacity="0.5" />
        <circle cx="12" cy="14" r="3" fill="#38bdf8" />
        <text x="22" y="18" fill="#bae6fd" font-size="12" font-weight="600" class="font-sans">C++</text>
      </g>

      <!-- C# -->
      <g transform="translate(326, 5)">
        <rect width="56" height="28" rx="6" fill="#1e1333" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
        <circle cx="12" cy="14" r="3" fill="#c084fc" />
        <text x="22" y="18" fill="#e9d5ff" font-size="12" font-weight="600" class="font-sans">C#</text>
      </g>

      <!-- C -->
      <g transform="translate(390, 5)">
        <rect width="48" height="28" rx="6" fill="#111827" stroke="#64748b" stroke-width="1" stroke-opacity="0.5" />
        <circle cx="12" cy="14" r="3" fill="#94a3b8" />
        <text x="22" y="18" fill="#cbd5e1" font-size="12" font-weight="600" class="font-sans">C</text>
      </g>

      <!-- HTML & CSS -->
      <g transform="translate(446, 5)">
        <rect width="108" height="28" rx="6" fill="#1f182e" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4" />
        <circle cx="12" cy="14" r="3" fill="#f472b6" />
        <text x="22" y="18" fill="#fbcfe8" font-size="12" font-weight="600" class="font-sans">HTML &amp; CSS</text>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT CARD / TERMINAL DISPLAY ================= -->
  <g transform="translate(670, 85)" filter="url(#dropShadow)">
    <!-- Main glass card -->
    <rect width="490" height="295" rx="16" fill="url(#cardGrad)" stroke="url(#innerBorder)" stroke-width="1.5" />

    <!-- Subtle inner grid -->
    <rect width="490" height="295" rx="16" fill="url(#dots)" />

    <!-- Terminal header -->
    <g transform="translate(20, 16)">
      <circle cx="6" cy="6" r="4.5" fill="#f43f5e" />
      <circle cx="20" cy="6" r="4.5" fill="#fbbf24" />
      <circle cx="34" cy="6" r="4.5" fill="#10b981" />
      <text x="55" y="10" fill="#94a3b8" font-size="11" font-weight="600" class="font-mono">profile_matrix.sh</text>

      <!-- Discord Badge Pill -->
      <g transform="translate(280, -4)">
        <rect width="170" height="22" rx="11" fill="url(#discordGrad)" />
        <!-- Discord Logo Icon -->
        <g transform="translate(10, 3) scale(0.65)">
          <path d="M18.97 4.16C17.52 3.5 15.98 3.01 14.37 2.73C14.17 3.08 13.94 3.55 13.78 3.93C12.06 3.67 10.36 3.67 8.67 3.93C8.51 3.55 8.27 3.08 8.08 2.73C6.47 3.01 4.92 3.5 3.48 4.17C0.55 8.49 -0.24 12.7 0.08 16.85C2.03 18.28 3.91 19.16 5.76 19.72C6.22 19.1 6.63 18.43 6.98 17.72C6.31 17.47 5.68 17.15 5.08 16.77C5.24 16.65 5.4 16.53 5.56 16.4C9.28 18.1 13.3 18.1 16.98 16.4C17.14 16.53 17.3 16.65 17.46 16.77C16.86 17.15 16.23 17.47 15.56 17.72C15.91 18.43 16.32 19.1 16.78 19.72C18.63 19.16 20.52 18.28 22.46 16.85C22.86 12.08 21.69 7.91 18.97 4.16ZM7.72 14.33C6.61 14.33 5.7 13.32 5.7 12.08C5.7 10.84 6.58 9.83 7.72 9.83C8.86 9.83 9.77 10.84 9.74 12.08C9.74 13.32 8.86 14.33 7.72 14.33ZM14.72 14.33C13.61 14.33 12.7 13.32 12.7 12.08C12.7 10.84 13.58 9.83 14.72 9.83C15.86 9.83 16.77 10.84 16.74 12.08C16.74 13.32 15.86 14.33 14.72 14.33Z" fill="#ffffff"/>
        </g>
        <text x="32" y="15" fill="#ffffff" font-size="11" font-weight="700" class="font-sans">@pir_fena</text>
      </g>
    </g>

    <line x1="16" y1="36" x2="474" y2="36" stroke="#334155" stroke-width="0.8" stroke-opacity="0.6" />

    <!-- Code / Key Metrics in Card -->
    <g transform="translate(24, 60)">
      <!-- Line 1: Identity -->
      <text x="0" y="0" fill="#a78bfa" font-size="13" class="font-mono">const <tspan fill="#38bdf8">developer</tspan> = {</text>

      <!-- Line 2: Discord Handle -->
      <g transform="translate(18, 22)">
        <text x="0" y="0" fill="#cbd5e1" font-size="12" class="font-mono">discord: <tspan fill="#f472b6">"pir_fena"</tspan>,</text>
      </g>

      <!-- Line 3: Focus -->
      <g transform="translate(18, 42)">
        <text x="0" y="0" fill="#cbd5e1" font-size="12" class="font-mono">focus: <tspan fill="#34d399">["Discord Bots", "Web Apps"]</tspan>,</text>
      </g>

      <!-- Line 4: Primary Stack -->
      <g transform="translate(18, 62)">
        <text x="0" y="0" fill="#cbd5e1" font-size="12" class="font-mono">runtime: <tspan fill="#facc15">"Node.js"</tspan>, engine: <tspan fill="#facc15">"V8"</tspan>,</text>
      </g>

      <!-- Line 5: Systems -->
      <g transform="translate(18, 82)">
        <text x="0" y="0" fill="#cbd5e1" font-size="12" class="font-mono">low_level: <tspan fill="#fb923c">["Rust", "C++", "C#", "C"]</tspan>,</text>
      </g>

      <!-- Line 6: Closing bracket -->
      <g transform="translate(0, 104)">
        <text x="0" y="0" fill="#a78bfa" font-size="13" class="font-mono">};</text>
      </g>
    </g>

    <!-- Mini Feature Highlight Modules -->
    <g transform="translate(24, 185)">
      <!-- Box 1: Discord Bot Engine -->
      <g transform="translate(0, 0)">
        <rect width="214" height="84" rx="10" fill="#0b1022" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.6" />
        <circle cx="16" cy="18" r="4" fill="#6366f1" />
        <text x="28" y="22" fill="#e0e7ff" font-size="12" font-weight="700" class="font-sans">Discord Engineering</text>
        <text x="14" y="44" fill="#94a3b8" font-size="11" class="font-sans">• Slash Commands &amp; API</text>
        <text x="14" y="62" fill="#94a3b8" font-size="11" class="font-sans">• High-uptime Bot Systems</text>
      </g>

      <!-- Box 2: Modern Web Stack -->
      <g transform="translate(228, 0)">
        <rect width="214" height="84" rx="10" fill="#0b1022" stroke="#0891b2" stroke-width="1" stroke-opacity="0.6" />
        <circle cx="16" cy="18" r="4" fill="#06b6d4" />
        <text x="28" y="22" fill="#cffafe" font-size="12" font-weight="700" class="font-sans">Modern Web Dev</text>
        <text x="14" y="44" fill="#94a3b8" font-size="11" class="font-sans">• Responsive HTML/CSS UI</text>
        <text x="14" y="62" fill="#94a3b8" font-size="11" class="font-sans">• Node.js / Fullstack Logic</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="20" y="415" width="1160" height="2.5" rx="1.25" fill="url(#accentGrad)" />
</svg>

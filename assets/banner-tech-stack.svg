<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 80" width="100%" height="100%">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b0f19" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#1e1b4b" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="textG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>
  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <rect width="1200" height="80" rx="12" fill="url(#bannerBg)" stroke="#312e81" stroke-width="1" />
  <line x1="100" y1="78" x2="1100" y2="78" stroke="url(#lineGrad)" stroke-width="2" />

  <g transform="translate(600, 46)" text-anchor="middle">
    <!-- Icon and Tag -->
    <text y="-14" fill="#a855f7" font-size="11" font-weight="700" letter-spacing="3" class="font-mono">CORE CAPABILITIES &amp; TOOLKIT</text>
    <text y="14" fill="url(#textG)" font-size="20" font-weight="800" letter-spacing="-0.5" class="font-sans">Technical Competencies &amp; Language Stack</text>
  </g>
</svg>
